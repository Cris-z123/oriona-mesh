[project]
name = "orionamesh-backend"
version = "0.1.0"
description = "OrionaMesh 个人知识库 RAG MVP 后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 配置与日志
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # 数据库与任务队列
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
    "celery>=5.4",
    # 认证
    "pyjwt>=2.10",
    "email-validator>=2.2",
    # 模型出口：LangChain OpenAI-compatible 协议集成
    "langchain-openai>=0.2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "markdown-it-py>=4.2.0",
    "charset-normalizer>=3.5.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
orionamesh-api = "app.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入是声明式默认值，允许 Depends/Query/File/Header 出现在参数默认位置。
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "migrations", "tests"]
exclude = ["**/.venv/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "unit: 单元测试：不依赖外部服务的纯逻辑验证",
    "integration: 集成测试：依赖真实 PostgreSQL/Redis 或跨组件协作",
    "contract: 契约测试：验证实现与冻结的 REST/SSE 契约一致",
    "architecture: 架构测试：验证依赖与职责边界",
    "security: 安全测试：验证脱敏、出口与授权边界",
]
