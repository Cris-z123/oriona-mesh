# OrionaMesh 单机运行编排。
#
# 应用镜像由 GitHub Release 交付：服务器只导入镜像，不构建、也不拉取应用镜像。
# `scripts/deploy.sh` 先运行 one-off migrate，成功后才更新 API/worker/前端/nginx。
name: orionamesh

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://orionamesh:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/orionamesh
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  DOCUMENT_STORAGE_ROOT: /data/orionamesh
  AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:?set AUTH_JWT_SECRET_KEY (UTF-8 编码后至少 32 字节)}
  RATE_LIMIT_SUBJECT_HMAC_KEY: ${RATE_LIMIT_SUBJECT_HMAC_KEY:?set RATE_LIMIT_SUBJECT_HMAC_KEY (至少 32 字节)}
  RATE_LIMIT_TRUSTED_PROXY_CIDRS: ${RATE_LIMIT_TRUSTED_PROXY_CIDRS:?set RATE_LIMIT_TRUSTED_PROXY_CIDRS}
  MODEL_GATEWAY_ENDPOINT: ${MODEL_GATEWAY_ENDPOINT:?set MODEL_GATEWAY_ENDPOINT (HTTPS base URL)}
  MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?set MODEL_GATEWAY_API_KEY}
  MODEL_GATEWAY_QUERY_REWRITE_MODEL: ${MODEL_GATEWAY_QUERY_REWRITE_MODEL:?set MODEL_GATEWAY_QUERY_REWRITE_MODEL}
  MODEL_GATEWAY_GENERATION_MODEL: ${MODEL_GATEWAY_GENERATION_MODEL:?set MODEL_GATEWAY_GENERATION_MODEL}
  MODEL_GATEWAY_RERANK_MODEL: ${MODEL_GATEWAY_RERANK_MODEL:-}

services:
  # 基础设施属于服务器首次部署；普通版本发布只更新 backend/frontend 镜像。
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: orionamesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: orionamesh
    volumes:
      - orionamesh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orionamesh -d orionamesh"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - orionamesh-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # one-off 迁移：部署脚本显式等待成功；API/worker 不在自身启动命令中执行迁移。
  migrate:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE from the verified release manifest}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE from the verified release manifest}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    restart: unless-stopped
    volumes:
      - orionamesh-data:/data/orionamesh
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE from the verified release manifest}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-B", "--loglevel=info"]
    environment: *backend-env
    restart: unless-stopped
    volumes:
      - orionamesh-data:/data/orionamesh
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # 进程存活不足以证明可消费任务；通过 broker 控制通道确认 worker 实际响应。
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE from the verified release manifest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # 由部署脚本注入已安装配置的绝对宿主机路径，避免 --project-directory
      # 改变相对 bind mount 的解析基准。
      - ${ORIONAMESH_NGINX_CONFIG:?set ORIONAMESH_NGINX_CONFIG to the installed nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  orionamesh-pgdata:
  orionamesh-redisdata:
  # API/worker 共用；容器重建和镜像升级后资料必须保留。
  orionamesh-data:
