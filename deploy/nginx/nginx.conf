# OrionaMesh 单机部署同源反代（无域名版）。
#
# 拓扑：浏览器 → nginx(80) → 前端容器(3000) 与 API 容器(8000/v1)，
# 前端与 API 同源（/v1 相对路径），无跨域、无 CORS 依赖。
#
# 用法：
#   - 放到 /etc/nginx/conf.d/orionamesh.conf（或腾讯云宝塔等面板的站点配置）后
#     `nginx -t && systemctl reload nginx`；
#   - 安全组放行 80（后续有域名 + 证书时追加 443 监听与 TLS 配置，location 不变）；
#   - 后端限流需要真实客户端 IP：在 deploy/compose/.env 中设置
#     RATE_LIMIT_TRUSTED_PROXY_CIDRS=127.0.0.1/32（本机反代）。
#   - SSE 必须关闭 proxy_buffering 并保持长连接（/v1/ 已配置）。

server {
    listen 80;
    server_name _;

    # 前端（Next.js）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端 REST + SSE（同源 /v1）
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 消息流：禁用缓冲，避免回答卡在 nginx 层
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 基础设施健康检查（监控用，无需暴露给公网时可删除）
    location = /health { proxy_pass http://127.0.0.1:8000; }
    location = /ready  { proxy_pass http://127.0.0.1:8000; }
}
