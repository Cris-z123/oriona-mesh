# 镜像构建与漏洞扫描门禁（T103）。
#
# 质量契约（quickstart「质量与交付验证」）：
# - PR 与 main / 正式 Git tag（v*）推送均构建 backend/frontend 双镜像并执行
#   Trivy 漏洞扫描（HIGH/CRITICAL 导致失败，exit-code=1）——合并前门禁即含镜像；
# - 镜像不发布到 GHCR：部署为服务器本地构建（scripts/deploy.sh，方案 A，
#   不依赖 GHCR/GitHub 网络），本工作流仅充当镜像质量门禁。
name: Images

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  # 同一 ref 并发推送/更新时取消旧 run；PR 与 main 各自独立。
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build & scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: deploy/docker/backend.Dockerfile
          - service: frontend
            dockerfile: deploy/docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4

      # 仅用于本地构建产物命名（GHCR 路径小写约束无实际发布语义）。
      - name: Lowercase image base
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.service }}
          tags: |
            # 不可变 sha-<full-sha> 本地命名，供 Trivy 扫描引用。
            type=sha,format=long,prefix=sha-
          flavor: |
            latest=false

      - name: Build and load
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # 不推送；load 到 runner 本地 docker 仓库供 Trivy 扫描。
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}-${{ matrix.service }}:sha-${{ github.sha }}
          # 只做漏洞扫描（--scanners vuln，T126-T131 后 Trivy 步骤失败根因）：
          # 镜像内硬编码的开发默认数据库连接串（app/core/settings.py
          # _DEFAULT_DATABASE_URL = postgresql+psycopg://orionamesh:orionamesh@localhost）
          # 命中 trivy 内置 postgres secret 规则；secret 结果不受 --severity 过滤
          # 影响、发现即配合 exit-code=1 失败，且 backend/frontend 双镜像同时命中。
          # 部署环境密钥由 assert_startup_config 强制注入（镜像内默认值不可用），
          # 不做镜像内 secret 扫描。
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
