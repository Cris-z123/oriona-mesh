# PR 保持镜像构建与 Trivy 门禁；正式 v* tag 额外发布可导入的 linux/amd64 镜像包。
# main 是受保护分支（仅 PR 合并），PR 门禁已扫描同一代码，不再单独构建；镜像产物只在正式 tag 产出。
name: Images

on:
  pull_request:
  push:
    tags: ["v*"]

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-and-scan:
    name: Build & scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # upload-artifact@v4 上传工件需要 actions: write；仅此 job 需要，workflow 级仍为 contents: read。
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: deploy/docker/backend.Dockerfile
            build_args: ""
          - service: frontend
            dockerfile: deploy/docker/frontend.Dockerfile
            # 构建时常量，编译进前端包；后端不需要。
            build_args: NEXT_PUBLIC_API_BASE_URL=/v1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build and load linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: orionamesh-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orionamesh-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Export release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-images
          docker image save --output release-images/${{ matrix.service }}.tar \
            orionamesh-${{ matrix.service }}:${{ env.IMAGE_TAG }}

      - name: Upload release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: release-images/${{ matrix.service }}.tar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Package GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release images
        uses: actions/download-artifact@v4
        with:
          pattern: "*-image"
          path: release/images
          merge-multiple: true

      - name: Package immutable deployment bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="orionamesh-release-${RELEASE_TAG}"
          mkdir -p "$bundle/images" "$bundle/deploy/compose" "$bundle/deploy/nginx" "$bundle/scripts"
          mv release/images/backend.tar "$bundle/images/backend.tar"
          mv release/images/frontend.tar "$bundle/images/frontend.tar"
          cat > "$bundle/release.env" <<EOF
          BACKEND_IMAGE=orionamesh-backend:sha-${GITHUB_SHA}
          FRONTEND_IMAGE=orionamesh-frontend:sha-${GITHUB_SHA}
          EOF
          cp deploy/compose/compose.yaml deploy/compose/.env.example "$bundle/deploy/compose/"
          cp deploy/nginx/nginx.conf "$bundle/deploy/nginx/"
          cp scripts/deploy.sh "$bundle/scripts/"
          chmod +x "$bundle/scripts/deploy.sh"
          (
            cd "$bundle"
            sha256sum images/backend.tar images/frontend.tar release.env \
              deploy/compose/compose.yaml deploy/compose/.env.example \
              deploy/nginx/nginx.conf scripts/deploy.sh > release.files.sha256
          )
          tar -czf "${bundle}.tar.gz" "$bundle"
          sha256sum "${bundle}.tar.gz" > "${bundle}.tar.gz.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="orionamesh-release-${RELEASE_TAG}.tar.gz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$bundle" "${bundle}.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$bundle" "${bundle}.sha256" --generate-notes
          fi
