openapi: 3.1.0
info:
  title: OrionaMesh MVP API
  version: 1.0.0
  description: >-
    面向私有知识库与可信问答的版本化 REST/SSE 契约。除 SSE 外，所有响应均返回统一 JSON
    信封。所有操作均受后端分级限流保护；x-rate-limit-policy 标识默认策略，实际阈值可由部署
    配置覆盖。超限统一返回 10005/429 和 Retry-After，且不产生业务副作用。
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /users:
    post:
      security: []
      summary: 注册用户
      x-rate-limit-policy: auth-ip-and-account
      requestBody: { $ref: '#/components/requestBodies/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/UserCreated' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/EmailAlreadyExists' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /auth/sessions:
    post:
      security: []
      summary: 创建登录会话
      x-rate-limit-policy: auth-ip-and-account
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '201': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    put:
      security: []
      summary: 轮换刷新会话
      x-rate-limit-policy: auth-ip-and-account
      description: 限流主体为来源 IP 与 refresh token 的 HMAC 指纹；不得把原始 token 写入 Redis、日志或指标。
      requestBody: { $ref: '#/components/requestBodies/RefreshSessionRequest' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/InvalidRefreshToken' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    delete:
      summary: 撤销当前会话
      x-rate-limit-policy: authenticated-default
      description: 使用 Bearer Access Token 认证当前用户，并通过请求体 refresh_token 定位要撤销的持久化会话；属于当前用户的已撤销或已过期会话重复删除仍成功，无法匹配或跨用户令牌返回 10006/401。
      requestBody: { $ref: '#/components/requestBodies/RefreshSessionRequest' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/SessionRevocationUnauthorized' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /users/me:
    get:
      summary: 获取当前用户
      x-rate-limit-policy: authenticated-default
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/UserDetails' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    patch:
      summary: 更新当前用户
      x-rate-limit-policy: authenticated-default
      requestBody: { $ref: '#/components/requestBodies/UpdateProfileRequest' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/UserDetails' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /knowledge-bases:
    get:
      summary: 列出当前用户知识库
      x-rate-limit-policy: authenticated-default
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/KnowledgeBaseList' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    post:
      summary: 创建知识库
      x-rate-limit-policy: authenticated-default
      requestBody: { $ref: '#/components/requestBodies/CreateKnowledgeBaseRequest' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '201': { $ref: '#/components/responses/KnowledgeBaseDetails' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /knowledge-bases/{knowledgeBaseId}:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    get:
      summary: 获取知识库
      x-rate-limit-policy: authenticated-default
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/KnowledgeBaseDetails' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/KnowledgeBaseNotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    patch:
      summary: 更新知识库
      x-rate-limit-policy: authenticated-default
      requestBody: { $ref: '#/components/requestBodies/UpdateKnowledgeBaseRequest' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/KnowledgeBaseDetails' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/KnowledgeBaseNotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    delete:
      summary: 删除知识库及其资料
      x-rate-limit-policy: authenticated-default
      description: 先将知识库置为内部 deleting 并编排全部资料的有界停止与 delete_cleanup；提交后立即隐藏，全部清理完成后再物理删除并级联对话、消息和引用。
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/KnowledgeBaseNotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /knowledge-bases/{knowledgeBaseId}/documents:
    parameters: [{ $ref: '#/components/parameters/KnowledgeBaseId' }]
    post:
      summary: 批量上传资料
      x-rate-limit-policy: upload-user
      description: 单文件最大 50MB，单请求最多 20 个 PDF、DOCX、MD 或 TXT 文件。服务端先校验整批；任一文件不合规时整批拒绝且不创建资料、任务、幂等结果或文件对象。
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: binary }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '202': { $ref: '#/components/responses/DocumentUploadAccepted' }
        '400': { $ref: '#/components/responses/UploadValidationFailed' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/KnowledgeBaseNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    get:
      summary: 列出资料
      x-rate-limit-policy: authenticated-default
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/DocumentStatus' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/DocumentList' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/KnowledgeBaseNotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /knowledge-bases/{knowledgeBaseId}/documents/{documentId}:
    parameters:
      - { $ref: '#/components/parameters/KnowledgeBaseId' }
      - { $ref: '#/components/parameters/DocumentId' }
    get:
      summary: 获取资料详情和持久化处理状态
      x-rate-limit-policy: authenticated-default
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/DocumentDetails' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    delete:
      summary: 删除资料；历史引用仅保留快照
      x-rate-limit-policy: authenticated-default
      description: 事务提交后资料立即从列表、详情和检索隐藏；运行 attempt 的持久化写入由数据库 fencing 拦截，最多等待当前 lease 到期后由恢复扫描器接管；专用 delete_cleanup 清理对象与派生数据并保留不可查询的 deleted 墓碑，后续 GET 返回 404。
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /knowledge-bases/{knowledgeBaseId}/documents/{documentId}/tasks:
    parameters:
      - { $ref: '#/components/parameters/KnowledgeBaseId' }
      - { $ref: '#/components/parameters/DocumentId' }
    get:
      summary: 获取资料处理任务和尝试记录
      x-rate-limit-policy: authenticated-default
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/DocumentTaskList' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /conversations:
    get:
      summary: 列出当前用户对话
      x-rate-limit-policy: authenticated-default
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/ConversationList' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    post:
      summary: 创建绑定知识库的对话
      x-rate-limit-policy: authenticated-default
      requestBody: { $ref: '#/components/requestBodies/CreateConversationRequest' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '201': { $ref: '#/components/responses/ConversationDetails' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/KnowledgeBaseNotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /conversations/{conversationId}:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    get:
      summary: 获取对话
      x-rate-limit-policy: authenticated-default
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/ConversationDetails' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    patch:
      summary: 重命名对话
      x-rate-limit-policy: authenticated-default
      requestBody: { $ref: '#/components/requestBodies/RenameConversationRequest' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/ConversationDetails' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    delete:
      summary: 删除对话
      x-rate-limit-policy: authenticated-default
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /conversations/{conversationId}/messages:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    get:
      summary: 分页获取历史消息
      x-rate-limit-policy: authenticated-default
      parameters:
        - { $ref: '#/components/parameters/MessageBefore' }
        - { $ref: '#/components/parameters/MessageLimit' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/MessageList' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
    post:
      summary: 发送问题并返回 SSE 回答
      x-rate-limit-policy: question-user
      requestBody: { $ref: '#/components/requestBodies/SendMessageRequest' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: >-
            text/event-stream。每个 SSE 帧的 event 为 message_start、retrieval_done、delta、message_end
            或 error，data 为对应统一响应信封的 JSON 序列化值。媒体 schema 表达实际文本线格式，
            x-sse-event-schema 描述解码后的判别联合事件对象。
          content:
            text/event-stream:
              schema: { type: string }
              x-sse-event-schema: { $ref: '#/components/schemas/SseEvent' }
              examples:
                delta:
                  value: |
                    event: delta
                    data: {"code":0,"data":{"text":"根据"},"msg":"","trace_id":"7eb23f43-e1f4-4a67-a64d-1a481b36030f"}

        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/KnowledgeBaseNotReady' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
  /conversations/{conversationId}/messages/{messageId}/citations:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
      - { $ref: '#/components/parameters/MessageId' }
    get:
      summary: 获取回答引用或删除后保留的来源快照
      x-rate-limit-policy: authenticated-default
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '500': { $ref: '#/components/responses/InternalError' }
        '200': { $ref: '#/components/responses/CitationList' }
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '503': { $ref: '#/components/responses/ProtectionUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token 有效期 2 小时；Refresh Token 有效期 7 天。
  parameters:
    KnowledgeBaseId: { name: knowledgeBaseId, in: path, required: true, schema: { type: string, format: uuid } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    MessageId: { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    DocumentStatus: { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/DocumentStatus' } }
    MessageBefore: { name: before, in: query, required: false, description: 返回该 message_id 之前的记录。, schema: { type: string, format: uuid } }
    MessageLimit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 同一用户与知识库范围内的批量上传重放键；重复请求返回首次已接受结果，不重复创建资源。
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
  requestBodies:
    RegisterRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } } }
    LoginRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } } }
    RefreshSessionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshSessionInput' } } } }
    UpdateProfileRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfileInput' } } } }
    CreateKnowledgeBaseRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseInput' } } } }
    UpdateKnowledgeBaseRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateKnowledgeBaseInput' } } } }
    CreateConversationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateConversationInput' } } } }
    RenameConversationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenameConversationInput' } } } }
    SendMessageRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageInput' } } } }
  responses:
    EmptySuccess: { description: 成功响应，data 为 null。 , content: { application/json: { schema: { $ref: '#/components/schemas/EmptyEnvelope' } } } }
    UserCreated: { description: 用户已创建。, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
    UserDetails: { description: 当前用户资料。, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
    SessionCreated: { description: 登录或刷新后的会话令牌。, content: { application/json: { schema: { $ref: '#/components/schemas/SessionEnvelope' } } } }
    KnowledgeBaseList: { description: 知识库分页列表。, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseListEnvelope' } } } }
    KnowledgeBaseDetails: { description: 知识库详情。, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseEnvelope' } } } }
    DocumentUploadAccepted: { description: 整批预校验后资料与初始任务已持久化；每个返回项只能是 queued，或文件转正补偿后的 failed/20011。内部 pending 不作为正常 202 返回状态。命中已收敛的同作用域 Idempotency-Key 时返回首次结果；仍在超时窗口内协调的同键重放返回 20008/409。, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentUploadEnvelope' } } } }
    DocumentList: { description: 资料分页列表。, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentListEnvelope' } } } }
    DocumentDetails: { description: 资料详情和处理状态。, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentEnvelope' } } } }
    DocumentTaskList: { description: 资料任务与尝试记录。, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentTaskListEnvelope' } } } }
    ConversationList: { description: 对话分页列表。, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationListEnvelope' } } } }
    ConversationDetails: { description: 对话详情。, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationEnvelope' } } } }
    MessageList: { description: 消息分页列表。, content: { application/json: { schema: { $ref: '#/components/schemas/MessageListEnvelope' } } } }
    CitationList: { description: 回答引用；当前来源与删除后快照使用同一 Citation DTO，并按 rank 升序返回。, content: { application/json: { schema: { $ref: '#/components/schemas/CitationListEnvelope' } } } }
    InvalidRequest: { description: 请求参数校验失败；业务码 10003，提示“请求参数不合法，请检查后重试”。, content: { application/json: { schema: { $ref: '#/components/schemas/InvalidRequestErrorEnvelope' } } } }
    UploadValidationFailed: { description: 整批上传格式或限制校验失败且无业务副作用；文件超限为 20003，数量超限为 20004，不支持格式为 20009。, content: { application/json: { schema: { $ref: '#/components/schemas/UploadValidationErrorEnvelope' } } } }
    Unauthorized: { description: 凭证无效；业务码 10004，不暴露凭证细节。, content: { application/json: { schema: { $ref: '#/components/schemas/InvalidCredentialsErrorEnvelope' } } } }
    InvalidRefreshToken: { description: Refresh Token 无效、过期、已撤销或发生重放；业务码 10006，提示重新登录。, content: { application/json: { schema: { $ref: '#/components/schemas/InvalidRefreshTokenErrorEnvelope' } } } }
    SessionRevocationUnauthorized:
      description: Access Token 过期，或请求体 Refresh Token 无效、过期、已撤销或不属于当前用户。
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/TokenExpiredErrorEnvelope' }
              - { $ref: '#/components/schemas/InvalidRefreshTokenErrorEnvelope' }
    TokenExpired: { description: Token 已过期；业务码 10001，提示“请重新登录”。, content: { application/json: { schema: { $ref: '#/components/schemas/TokenExpiredErrorEnvelope' } } } }
    Forbidden: { description: 当前用户无权访问资源；业务码 10002，提示“您无权查看此内容”。, content: { application/json: { schema: { $ref: '#/components/schemas/ForbiddenErrorEnvelope' } } } }
    NotFound: { description: 资源不存在或对当前用户不可见；业务码 20007，不泄露资源归属。, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceNotFoundErrorEnvelope' } } } }
    KnowledgeBaseNotFound: { description: 知识库不存在；业务码 20002，提示“请求的知识库不存在”。, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseNotFoundErrorEnvelope' } } } }
    Conflict: { description: 请求与当前资源状态冲突；业务码 20008，不泄露资源细节。, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceConflictErrorEnvelope' } } } }
    EmailAlreadyExists: { description: 邮箱已注册；业务码 20006，提示“该邮箱已注册，请直接登录”。, content: { application/json: { schema: { $ref: '#/components/schemas/EmailAlreadyExistsErrorEnvelope' } } } }
    KnowledgeBaseNotReady: { description: 知识库没有已完成资料；业务码 20005，提示用户上传或等待资料处理完成。, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseNotReadyErrorEnvelope' } } } }
    RateLimitExceeded:
      description: 请求超过当前端点类别的服务端限流阈值；业务码 10005，不产生业务副作用。
      headers:
        Retry-After:
          description: 客户端再次尝试前至少等待的秒数。
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RateLimitExceededErrorEnvelope' }
    ProtectionUnavailable:
      description: 高风险写入端点的限流保护临时不可用；业务码 50001，服务端未执行业务写入。
      headers:
        Retry-After:
          description: 建议客户端再次尝试前等待的秒数。
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProtectionUnavailableErrorEnvelope' }
    InternalError: { description: 未分类内部服务错误；业务码 50000，不返回异常、供应商响应或资料内容。, content: { application/json: { schema: { $ref: '#/components/schemas/InternalErrorErrorEnvelope' } } } }
  schemas:
    ApiEnvelope:
      type: object
      required: [code, data, msg, trace_id]
      properties:
        code:
          oneOf:
            - { const: 0 }
            - { $ref: '#/components/schemas/ErrorCode' }
          description: 0 为成功；非 0 必须使用 ErrorCode 中定义的业务错误码。
        data: { type: ['object', 'array', 'string', 'number', 'boolean', 'null'] }
        msg: { type: string }
        trace_id: { type: string, format: uuid }
    ApiEnvelopeBase:
      type: object
      required: [code, data, msg, trace_id]
      properties:
        code: { const: 0 }
        data: {}
        msg: { type: string }
        trace_id: { type: string, format: uuid }
    ErrorEnvelope:
      type: object
      required: [code, data, msg, trace_id]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        data: { type: ['object', 'array', 'string', 'number', 'boolean', 'null'] }
        msg: { type: string }
        trace_id: { type: string, format: uuid }
    TokenExpiredErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 10001 }
            msg: { const: 请重新登录 }
    InvalidRequestErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 10003 }
            msg: { const: 请求参数不合法，请检查后重试 }
    InvalidCredentialsErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 10004 }
            msg: { const: 邮箱或密码错误 }
    InvalidRefreshTokenErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 10006 }
            msg: { const: 登录状态已失效，请重新登录 }
    RateLimitExceededErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 10005 }
            msg: { const: 请求过于频繁，请稍后再试 }
    ProtectionUnavailableErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 50001 }
            msg: { const: 系统繁忙，请稍后再试 }
    InternalErrorErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 50000 }
            msg: { const: 系统繁忙，请稍后再试 }
    ForbiddenErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 10002 }
            msg: { const: 您无权查看此内容 }
    KnowledgeBaseNotFoundErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 20002 }
            msg: { const: 请求的知识库不存在 }
    ResourceNotFoundErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 20007 }
            msg: { const: 请求的资源不存在 }
    ResourceConflictErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 20008 }
            msg: { const: 请求与当前资源状态冲突 }
    UploadValidationErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { enum: [20003, 20004, 20009] }
            msg: { type: string, enum: [文件超过 50MB 限制, 单次上传最多 20 个文件, 仅支持 PDF、DOCX、MD 和 TXT 文件] }
    KnowledgeBaseNotReadyErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 20005 }
            msg: { const: 当前知识库没有已完成资料，请上传或等待资料处理完成 }
    EmailAlreadyExistsErrorEnvelope:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            code: { const: 20006 }
            msg: { const: 该邮箱已注册，请直接登录 }
    ErrorCode:
      type: integer
      enum: [10001, 10002, 10003, 10004, 10005, 10006, 20001, 20002, 20003, 20004, 20005, 20006, 20007, 20008, 20009, 20010, 20011, 20012, 20013, 20014, 50000, 50001]
      description: 10001 Token 过期；10002 无权；10003 参数校验失败；10004 登录凭证无效；10005 RATE_LIMIT_EXCEEDED；10006 INVALID_REFRESH_TOKEN；20001 DOCUMENT_PARSE_FAILED（异步）；20002 知识库不存在；20003 FILE_TOO_LARGE；20004 TOO_MANY_FILES；20005 KNOWLEDGE_BASE_NOT_READY；20006 EMAIL_ALREADY_EXISTS；20007 资源不存在；20008 资源冲突；20009 UNSUPPORTED_FILE_TYPE；20010 EMPTY_DOCUMENT（异步）；20011 DOCUMENT_STORAGE_FAILED（异步）；20012 DOCUMENT_EMBEDDING_FAILED（异步）；20013 DOCUMENT_FINALIZE_FAILED（异步）；20014 DOCUMENT_RETRY_EXHAUSTED（异步且无稳定根因）；50000 内部错误；50001 RATE_LIMIT_PROTECTION_UNAVAILABLE。
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        display_name: { type: string, minLength: 1, maxLength: 100 }
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshSessionInput:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties: { refresh_token: { type: string, minLength: 1 } }
    UpdateProfileInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: { display_name: { type: string, minLength: 1, maxLength: 100 } }
    KnowledgeBaseInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    UpdateKnowledgeBaseInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    CreateConversationInput:
      type: object
      additionalProperties: false
      required: [knowledge_base_id]
      properties:
        knowledge_base_id: { type: string, format: uuid, description: 当前用户有权访问且必须绑定的知识库标识。 }
        title: { type: string, minLength: 1, maxLength: 200 }
    RenameConversationInput:
      type: object
      additionalProperties: false
      required: [title]
      properties: { title: { type: string, minLength: 1, maxLength: 200 } }
    SendMessageInput:
      type: object
      additionalProperties: false
      required: [content]
      properties: { content: { type: string, minLength: 1, maxLength: 12000 } }
    User:
      type: object
      required: [id, email, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: ['string', 'null'] }
    SessionTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 7200 }
    KnowledgeBase:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: ['string', 'null'], maxLength: 1000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentStatus:
      type: string
      enum: [pending, queued, processing, completed, failed, deleting, deleted]
    DocumentTaskType:
      type: string
      enum: [parse, chunk, embed, finalize, cleanup, delete_cleanup]
      description: cleanup 仅清理旧版本；delete_cleanup 仅用于被删除资料的文件与派生数据清理。
    Document:
      type: object
      required: [id, knowledge_base_id, filename, file_type, file_size, status, version, current_task_type, retry_count, chunk_count, error_code, error_message, processing_started_at, processing_finished_at, created_at, updated_at, allowed_actions]
      properties:
        id: { type: string, format: uuid }
        knowledge_base_id: { type: string, format: uuid }
        filename: { type: string }
        file_type: { type: string, enum: [pdf, docx, md, txt] }
        file_size: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        version: { type: integer, minimum: 1 }
        current_task_type:
          oneOf:
            - { $ref: '#/components/schemas/DocumentTaskType' }
            - { type: 'null' }
        retry_count: { type: integer, minimum: 0 }
        chunk_count: { type: integer, minimum: 0 }
        error_code: { type: ['integer', 'null'], enum: [20001, 20010, 20011, 20012, 20013, 20014, 50000, null], description: 异步处理失败的持久化业务码；详情接口仍返回 HTTP 200。 }
        error_message: { type: ['string', 'null'], description: 安全提示；20011“文件保存失败，请删除后重新上传”，20012“资料向量化失败，请删除后重新上传”，20013“资料处理结果不一致，请删除后重新上传”，20014“资料处理失败，请删除后重新上传”。 }
        processing_started_at: { type: ['string', 'null'], format: date-time }
        processing_finished_at: { type: ['string', 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        allowed_actions:
          type: array
          uniqueItems: true
          description: 服务端按当前状态计算；失败状态仅允许 delete，客户端不得自行推导重试或重处理能力。
          items: { type: string, enum: [delete] }
    DocumentTask:
      type: object
      required: [id, document_id, document_version, task_type, status, retry_count, max_retries, total_items, processed_items, error_code, error_message, queued_at, started_at, finished_at, created_at, updated_at, attempts]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_version: { type: integer, minimum: 1 }
        task_type: { $ref: '#/components/schemas/DocumentTaskType' }
        status: { type: string, enum: [pending, queued, running, succeeded, failed, cancelled] }
        retry_count: { type: integer, minimum: 0 }
        max_retries: { type: integer, minimum: 0 }
        total_items: { type: ['integer', 'null'], minimum: 0 }
        processed_items: { type: integer, minimum: 0 }
        error_code: { type: ['integer', 'null'], enum: [20001, 20010, 20011, 20012, 20013, 20014, 50000, null], description: 异步任务失败的持久化业务码；任务列表接口仍返回 HTTP 200。 }
        error_message: { type: ['string', 'null'], description: 与资料详情使用相同的稳定安全提示，不得包含供应商响应、路径或资料正文。 }
        queued_at: { type: ['string', 'null'], format: date-time }
        started_at: { type: ['string', 'null'], format: date-time }
        finished_at: { type: ['string', 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        attempts: { type: array, items: { $ref: '#/components/schemas/DocumentTaskAttempt' } }
    DocumentTaskAttempt:
      type: object
      required: [id, task_id, attempt_no, status, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        attempt_no: { type: integer, minimum: 1 }
        worker_name: { type: ['string', 'null'] }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        started_at: { type: ['string', 'null'], format: date-time }
        finished_at: { type: ['string', 'null'], format: date-time }
        error_message: { type: ['string', 'null'] }
        duration_ms: { type: ['integer', 'null'], minimum: 0 }
        created_at: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, knowledge_base_id, title, last_message_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        knowledge_base_id: { type: string, format: uuid }
        title: { type: ['string', 'null'] }
        last_message_at: { type: ['string', 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      oneOf:
        - { $ref: '#/components/schemas/UserMessage' }
        - { $ref: '#/components/schemas/AssistantMessage' }
      discriminator:
        propertyName: role
        mapping:
          user: '#/components/schemas/UserMessage'
          assistant: '#/components/schemas/AssistantMessage'
    UserMessage:
      type: object
      required: [id, conversation_id, role, content, status, rewritten_query, finish_reason, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { type: string, const: user }
        content: { type: string }
        status: { type: string, const: completed }
        rewritten_query: { type: ['string', 'null'] }
        finish_reason: { type: 'null' }
        created_at: { type: string, format: date-time }
    AssistantMessage:
      type: object
      required: [id, conversation_id, role, content, status, rewritten_query, finish_reason, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { type: string, const: assistant }
        content: { type: string }
        status: { type: string, enum: [streaming, completed, cancelled, failed] }
        rewritten_query: { type: 'null' }
        finish_reason: { type: ['string', 'null'], enum: [stop, length, error, cancelled, null] }
        created_at: { type: string, format: date-time }
    Citation:
      type: object
      description: source_type=live 时 chunk_id/document_id 指向当前可访问来源；source_type=snapshot 时两个 ID 均为 null，其他展示字段来自保存快照。
      required: [rank, score, chunk_id, document_id, document_version, filename, file_type, page, section, content, source_type]
      oneOf:
        - title: 当前可访问来源
          properties:
            source_type: { const: live }
            chunk_id: { type: string, format: uuid }
            document_id: { type: string, format: uuid }
        - title: 历史来源快照
          properties:
            source_type: { const: snapshot }
            chunk_id: { type: 'null' }
            document_id: { type: 'null' }
      properties:
        rank: { type: integer, minimum: 1, description: 回答生成时的证据排序名次；数组按该字段升序返回。 }
        score: { type: number, description: 回答生成时保存的融合或重排相关性分数。 }
        chunk_id: { type: ['string', 'null'], format: uuid }
        document_id: { type: ['string', 'null'], format: uuid }
        document_version: { type: integer, minimum: 1 }
        filename: { type: string }
        file_type: { type: string, enum: [pdf, docx, md, txt] }
        page: { type: ['integer', 'null'], minimum: 1 }
        section: { type: ['string', 'null'] }
        content: { type: string, description: 受限长度的来源内容预览；不得用于恢复原始资料。 }
        source_type: { type: string, enum: [live, snapshot] }
    CitationPreview:
      allOf: [{ $ref: '#/components/schemas/Citation' }]
      description: SSE retrieval_done 使用与引用详情相同的字段语义，避免客户端二次映射。
    MessageStartData:
      type: object
      required: [message_id]
      properties: { message_id: { type: string, format: uuid } }
    RetrievalDoneData:
      type: object
      required: [citations]
      properties: { citations: { type: array, items: { $ref: '#/components/schemas/CitationPreview' } } }
    DeltaData:
      type: object
      required: [text]
      properties: { text: { type: string, minLength: 1 } }
    MessageEndData:
      type: object
      required: [message_id, finish_reason]
      properties:
        message_id: { type: string, format: uuid }
        finish_reason: { type: string, enum: [stop, length, cancelled] }
    MessageStartEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/MessageStartData' } }
    RetrievalDoneEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/RetrievalDoneData' } }
    DeltaEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/DeltaData' } }
    MessageEndEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/MessageEndData' } }
    MessageStartEvent:
      type: object
      required: [event, data]
      properties:
        event: { const: message_start }
        data: { $ref: '#/components/schemas/MessageStartEnvelope' }
    RetrievalDoneEvent:
      type: object
      required: [event, data]
      properties:
        event: { const: retrieval_done }
        data: { $ref: '#/components/schemas/RetrievalDoneEnvelope' }
    DeltaEvent:
      type: object
      required: [event, data]
      properties:
        event: { const: delta }
        data: { $ref: '#/components/schemas/DeltaEnvelope' }
    MessageEndEvent:
      type: object
      required: [event, data]
      properties:
        event: { const: message_end }
        data: { $ref: '#/components/schemas/MessageEndEnvelope' }
    StreamErrorEvent:
      type: object
      required: [event, data]
      properties:
        event: { const: error }
        data: { $ref: '#/components/schemas/ErrorEnvelope' }
    SseEvent:
      oneOf:
        - { $ref: '#/components/schemas/MessageStartEvent' }
        - { $ref: '#/components/schemas/RetrievalDoneEvent' }
        - { $ref: '#/components/schemas/DeltaEvent' }
        - { $ref: '#/components/schemas/MessageEndEvent' }
        - { $ref: '#/components/schemas/StreamErrorEvent' }
      discriminator:
        propertyName: event
        mapping:
          message_start: '#/components/schemas/MessageStartEvent'
          retrieval_done: '#/components/schemas/RetrievalDoneEvent'
          delta: '#/components/schemas/DeltaEvent'
          message_end: '#/components/schemas/MessageEndEvent'
          error: '#/components/schemas/StreamErrorEvent'
    Pagination:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: {} }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    KnowledgeBasePage:
      allOf: [{ $ref: '#/components/schemas/Pagination' }]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/KnowledgeBase' } } }
    DocumentPage:
      allOf: [{ $ref: '#/components/schemas/Pagination' }]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Document' } } }
    DocumentTaskPage:
      allOf: [{ $ref: '#/components/schemas/Pagination' }]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentTask' } } }
    ConversationPage:
      allOf: [{ $ref: '#/components/schemas/Pagination' }]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Conversation' } } }
    MessageCursorPage:
      type: object
      required: [items, has_more, next_before]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Message' } }
        has_more: { type: boolean }
        next_before: { type: ['string', 'null'], format: uuid, description: has_more 为 true 时用于下一页 before 参数。 }
    CitationPage:
      allOf: [{ $ref: '#/components/schemas/Pagination' }]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Citation' } } }
    DocumentUploadResult:
      type: object
      required: [documents]
      properties: { documents: { type: array, items: { $ref: '#/components/schemas/DocumentUploadItem' } } }
    DocumentUploadItem:
      oneOf:
        - title: 已排队资料
          allOf:
            - { $ref: '#/components/schemas/Document' }
            - type: object
              properties:
                status: { const: queued }
                current_task_type: { const: parse }
                error_code: { type: 'null' }
                error_message: { type: 'null' }
        - title: 文件转正失败资料
          allOf:
            - { $ref: '#/components/schemas/Document' }
            - type: object
              properties:
                status: { const: failed }
                current_task_type: { const: parse }
                error_code: { const: 20011 }
                error_message: { const: 文件保存失败，请删除后重新上传 }
    EmptyEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { type: 'null' } }
    UserEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/User' } }
    SessionEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/SessionTokens' } }
    KnowledgeBaseEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/KnowledgeBase' } }
    KnowledgeBaseListEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/KnowledgeBasePage' } }
    DocumentUploadEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/DocumentUploadResult' } }
    DocumentEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/Document' } }
    DocumentListEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/DocumentPage' } }
    DocumentTaskListEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/DocumentTaskPage' } }
    ConversationEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/Conversation' } }
    ConversationListEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/ConversationPage' } }
    MessageListEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
      properties: { data: { $ref: '#/components/schemas/MessageCursorPage' } }
    CitationListEnvelope:
      allOf: [{ $ref: '#/components/schemas/ApiEnvelopeBase' }]
